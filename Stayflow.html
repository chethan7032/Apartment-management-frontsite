<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="widtS=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Stayflow</title>
    <link rel="icon" href="./assets/stayflow-mark.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Stayflow helps PG, hostel and apartment owners manage rooms, tenants, invoices, payments and resident requests in one workspace."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Telugu:wght@500&family=Noto+Sans+Devanagari:wght@500&display=swap"
    />
    <style>
      /* Layout: left-aligned hero beside a live bed-map card; alternating bands; features as a tabbed spec sheet; phone mockup for the mobile app. */
      :root {
        --bg: #f8f7fa;
        --surface: #ffffff;
        --ink: #2f3349;
        --muted: #6f6b7d;
        --line: #dbdade;
        --brand: #18a4ff;
        --brand-ink: #122e46;
        --soft: #edf8ff;
        --accent: #f0a81c;
        --accent-ink: #2a1d00;
        --occ: #18a4ff;
        --empty: #cfdad6;
        --due: #f0a81c;
        --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
        --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #25293c;
          --surface: #2f3349;
          --ink: #cfd3ec;
          --muted: #b6bee3;
          --line: #434968;
          --brand: #73c9ff;
          --brand-ink: #122e46;
          --soft: #2e355a;
          --accent: #f2b53a;
          --accent-ink: #2a1d00;
          --occ: #73c9ff;
          --empty: #434968;
          --due: #f2b53a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #25293c;
        --surface: #2f3349;
        --ink: #cfd3ec;
        --muted: #b6bee3;
        --line: #434968;
        --brand: #73c9ff;
        --brand-ink: #122e46;
        --soft: #2e355a;
        --accent: #f2b53a;
        --accent-ink: #2a1d00;
        --occ: #73c9ff;
        --empty: #434968;
        --due: #f2b53a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 16px;
        line-height: 1.6;
        margin: 0;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 60;
        background: var(--bg);
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        line-height: 1.1;
        margin: 0;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      section {
        scroll-margin-top: 72px;
      }
      .band {
        padding-block: 72px;
      }
      .band.alt {
        background: var(--surface);
        border-block: 1px solid var(--line);
      }
      .eyebrow {
        font-family: var(--f-mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand);
        margin-bottom: 12px;
      }
      .h2 {
        font-size: clamp(28px, 4.2vw, 42px);
        font-weight: 700;
        max-width: 22ch;
      }
      .lead {
        color: var(--muted);
        font-size: 18px;
        max-width: 60ch;
        margin-top: 14px;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* nav */
      .nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 50;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .nav .wrap {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 64px;
      }
      .brand {
        font-family: var(--f-display);
        font-weight: 800;
        font-size: 22px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand i {
        display: contents;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        flex: 0 0 34px;
      }
      .links {
        display: flex;
        gap: 22px;
        margin-left: auto;
        align-items: center;
      }
      .links a {
        text-decoration: none;
        font-size: 15px;
        color: var(--muted);
        font-weight: 500;
      }
      .links a:hover {
        color: var(--ink);
      }
      .menu-btn {
        display: none;
        margin-left: auto;
        background: none;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 10px;
        padding: 12px 20px;
        font: 600 15px var(--f-body);
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
        min-height: 44px;
      }
      .btn.primary {
        background: var(--brand);
        color: var(--brand-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.ghost {
        border-color: var(--line);
        color: var(--ink);
        background: transparent;
      }
      .btn.ghost:hover {
        border-color: var(--brand);
      }
      .links .btn {
        color: var(--brand-ink);
        padding: 9px 16px;
        min-height: 40px;
      }
      @media (max-width: 860px) {
        .menu-btn {
          display: block;
        }
        .links {
          display: none;
          position: absolute;
          left: 0;
          right: 0;
          top: 64px;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          background: var(--bg);
          border-bottom: 1px solid var(--line);
          padding: 8px max(16px, env(safe-area-inset-left, 0px)) 16px;
        }
        .links.open {
          display: flex;
        }
        .links a {
          padding: 12px 0;
          font-size: 16px;
        }
        .links .btn {
          margin-top: 8px;
        }
      }

      /* hero */
      .hero {
        padding-block: 56px 72px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 48px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 800;
        max-width: 14ch;
      }
      .hero h1 em {
        font-style: normal;
        background: linear-gradient(
          transparent 62%,
          var(--accent) 62% 92%,
          transparent 92%
        );
      }
      .hero .lead {
        font-size: 19px;
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 28px;
      }
      .chip {
        font-size: 13px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 5px 12px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .hero-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }
      }

      /* bed map */
      .map {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 40px -24px rgba(8, 40, 32, 0.35);
        min-width: 0;
      }
      .map-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .map-head strong {
        font-family: var(--f-display);
        font-size: 18px;
      }
      .map-head span {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--f-mono);
      }
      .rooms {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .room {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: var(--bg);
        min-width: 0;
      }
      .room b {
        font-family: var(--f-mono);
        font-size: 13px;
        display: block;
        margin-bottom: 8px;
      }
      .room small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .beds {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .bed {
        width: 22px;
        height: 14px;
        border-radius: 4px;
        background: var(--empty);
      }
      .bed.o {
        background: var(--occ);
      }
      .bed.d {
        background: var(--occ);
        box-shadow:
          0 0 0 2px var(--surface),
          0 0 0 4px var(--due);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend .bed {
        width: 14px;
        height: 10px;
      }
      .map-foot {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .map-foot div {
        min-width: 0;
      }
      .map-foot b {
        display: block;
        font-family: var(--f-display);
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .map-foot span {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 420px) {
        .rooms {
          grid-template-columns: repeat(2, 1fr);
        }
        .map-foot b {
          font-size: 18px;
        }
      }

      /* problem */
      .problem {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        margin-top: 36px;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg);
      }
      .problem div {
        padding: 22px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .problem div:last-child {
        border-right: 0;
      }
      .problem s {
        display: block;
        color: var(--muted);
        text-decoration-thickness: 2px;
        font-size: 15px;
      }
      .problem b {
        display: block;
        margin-top: 10px;
        font-family: var(--f-display);
        font-size: 17px;
      }
      .problem p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      @media (max-width: 860px) {
        .problem {
          grid-template-columns: 1fr 1fr;
        }
        .problem div:nth-child(2) {
          border-right: 0;
        }
        .problem div:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }
      }
      @media (max-width: 480px) {
        .problem {
          grid-template-columns: 1fr;
        }
        .problem div {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .problem div:last-child {
          border-bottom: 0;
        }
      }

      /* features */
      .tabs {
        display: flex;
        gap: 6px;
        margin-top: 32px;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: thin;
      }
      .tab {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        border-radius: 999px;
        padding: 9px 16px;
        font: 500 14px var(--f-body);
        cursor: pointer;
        min-height: 40px;
      }
      .tab[aria-selected="true"] {
        background: var(--brand);
        color: var(--brand-ink);
        border-color: var(--brand);
      }
      .panel {
        margin-top: 20px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 40px;
      }
      .panel h3 {
        font-size: 28px;
        font-weight: 700;
      }
      .panel .lead {
        font-size: 16px;
      }
      .points {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      .points li {
        position: relative;
        padding-left: 28px;
        min-width: 0;
      }
      .points li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 14px;
        height: 9px;
        border-radius: 3px;
        background: var(--occ);
      }
      .setup {
        margin-top: 18px;
        border-left: 3px solid var(--accent);
        padding: 6px 0 6px 14px;
        font-size: 14px;
        color: var(--muted);
      }
      .setup b {
        color: var(--ink);
      }
      @media (max-width: 860px) {
        .panel {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 22px;
        }
      }

      /* audience */
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        margin-top: 28px;
        background: var(--bg);
        flex-wrap: wrap;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: 500 14px var(--f-body);
        padding: 10px 18px;
        border-radius: 9px;
        cursor: pointer;
        min-height: 40px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--brand);
        color: var(--brand-ink);
      }
      .aud {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .aud div {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        background: var(--surface);
        min-width: 0;
      }
      .aud h3 {
        font-size: 18px;
        margin-bottom: 6px;
      }
      .aud p {
        color: var(--muted);
        font-size: 15px;
      }
      @media (max-width: 700px) {
        .aud {
          grid-template-columns: 1fr;
        }
      }

      /* steps */
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-top: 36px;
        counter-reset: s;
      }
      .step {
        position: relative;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        min-width: 0;
      }
      .step::before {
        counter-increment: s;
        content: counter(s);
        font-family: var(--f-mono);
        font-size: 13px;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        margin-bottom: 14px;
      }
      .step h3 {
        font-size: 18px;
        margin-bottom: 6px;
      }
      .step p {
        font-size: 14px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .steps {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 480px) {
        .steps {
          grid-template-columns: 1fr;
        }
      }

      /* mobile app */
      .app-grid {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 56px;
        align-items: center;
      }
      .app-list {
        list-style: none;
        padding: 0;
        margin: 26px 0 0;
        display: grid;
        gap: 14px;
      }
      .app-list li {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 14px;
        min-width: 0;
      }
      .app-list i {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--soft);
        display: grid;
        place-items: center;
        font-style: normal;
        font-family: var(--f-mono);
        font-size: 13px;
        color: var(--brand);
      }
      .app-list b {
        display: block;
      }
      .app-list span {
        color: var(--muted);
        font-size: 15px;
      }
      .phone {
        width: 100%;
        max-width: 300px;
        margin: 0 auto;
        border-radius: 36px;
        border: 8px solid var(--ink);
        background: var(--bg);
        padding: 18px 14px 20px;
        box-shadow: 0 24px 50px -28px rgba(0, 0, 0, 0.5);
      }
      .phone .top {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .phone .hi {
        font-family: var(--f-display);
        font-weight: 700;
        font-size: 20px;
      }
      .phone .sub {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--f-mono);
      }
      .due {
        margin-top: 14px;
        border-radius: 16px;
        background: var(--brand);
        color: var(--brand-ink);
        padding: 16px;
      }
      .due small {
        opacity: 0.85;
        font-size: 12px;
      }
      .due strong {
        display: block;
        font-family: var(--f-display);
        font-size: 30px;
        font-variant-numeric: tabular-nums;
      }
      .due span {
        display: inline-block;
        margin-top: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        font-size: 13px;
        padding: 7px 14px;
        border-radius: 8px;
      }
      .rows {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }
      .rows div {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 13px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .rows em {
        font-style: normal;
        color: var(--muted);
        font-size: 12px;
        font-family: var(--f-mono);
      }
      .sample {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 14px;
      }
      @media (max-width: 860px) {
        .app-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }
      }

      /* languages */
      .lang {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      .lang div {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 12px;
        padding: 10px 18px;
        font-family:
          var(--f-display), "Noto Sans Telugu", "Noto Sans Devanagari",
          sans-serif;
        font-size: 20px;
        font-weight: 600;
      }
      .lang small {
        display: block;
        font-family: var(--f-mono);
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }

      /* pricing + services */
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 36px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        background: var(--surface);
        min-width: 0;
      }
      .card.hl {
        border-color: var(--brand);
        box-shadow: 0 0 0 1px var(--brand);
      }
      .card h3 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .card p {
        color: var(--muted);
        font-size: 15px;
      }
      .card ul {
        margin: 14px 0 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 15px;
        display: grid;
        gap: 6px;
      }
      .tag {
        display: inline-block;
        font-family: var(--f-mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 3px 9px;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .two {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 900px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
      }

            "Payment setup",
            "Connect Razorpay or Stripe and test a payment before you go live.",
          ],
          [
            "WhatsApp and email setup",
            "Configure Twilio WhatsApp and SMTP, and review the message templates.",
          ],
          [
            "Customisation",
            "Adapt templates, fields and workflows to how you run your business.",
          ],
          [
            "Training and support",
            "Walk your staff through the system and answer questions after launch.",
          ],
        ];
        return html`<section class="band alt" id="services">
          <div class="wrap">
            <div class="eyebrow">Services</div>
            <h2 class="h2">We set it up and keep it running.</h2>
            <div class="cards">
              ${s.map(
                ([t, d]) =>
                  html`<div class="card" key=${t}>
                    <h3>${t}</h3>
                    <p>${d}</p>
                  </div>`,
              )}
            </div>
          </div>
        </section>`;
      }

      function Faq() {
        return html`<section class="band" id="faq">
          <div class="wrap">
            <div class="eyebrow">Questions</div>
            <h2 class="h2">Answers before you ask.</h2>
            <div class="faq">
              ${FAQ.map(
                ([q, a]) =>
                  html`<details key=${q}>
                    <summary>${q}</summary>
                    <p>${a}</p>
                  </details>`,
              )}
            </div>
          </div>
        </section>`;
      }

      function Demo() {
        const [v, setV] = useState({
          name: "",
          phone: "",
          type: "PG or hostel",
          size: "",
          city: "",
          note: "",
        });
        const [msg, setMsg] = useState("");
        const [copied, setCopied] = useState("");
        const ta = useRef(null);
        const set = (k) => (e) => setV({ ...v, [k]: e.target.value });
        const submit = (e) => {
          e.preventDefault();
          setCopied("");
          setMsg(
            "Hello, I would like a demo of " +
              CONFIG.brand +
              ".\n\nName: " +
              v.name +
              "\nPhone: " +
              v.phone +
              "\nBusiness: " +
              v.type +
              "\nRooms or units: " +
              (v.size || "not given") +
              "\nCity: " +
              (v.city || "not given") +
              (v.note ? "\nNote: " + v.note : ""),
          );
        };
        const copy = async () => {
          try {
            await navigator.clipboard.writeText(msg);
            setCopied("Copied. Paste it into WhatsApp or email.");
          } catch (err) {
            if (ta.current) {
              ta.current.focus();
              ta.current.select();
            }
            setCopied("Text selected. Copy it with your keyboard.");
          }
        };
        const mail = CONFIG.email
          ? "mailto:" +
            CONFIG.email +
            "?subject=" +
            encodeURIComponent(CONFIG.brand + " demo request") +
            "&body=" +
            encodeURIComponent(msg)
          : "";
        const wa = CONFIG.whatsapp
          ? "https://wa.me/" +
            CONFIG.whatsapp +
            "?text=" +
            encodeURIComponent(msg)
          : "";
        return html`<section class="band alt" id="demo">
          <div class="wrap demo">
            <div>
              <div class="eyebrow">Book a demo</div>
              <h2 class="h2">See it with your own rooms in mind.</h2>
              <p class="lead">
                Tell us about your property and we will walk you through the
                parts that matter for it.
              </p>
              <div class="contact">
                ${CONFIG.email
                  ? html`<div>Email: <code>${CONFIG.email}</code></div>`
                  : null}
                ${CONFIG.whatsapp
                  ? html`<div>WhatsApp: <code>+${CONFIG.whatsapp}</code></div>`
                  : null}
              </div>
            </div>
            <form class="form" onSubmit=${submit}>
              <div class="field">
                <label htmlFor="f-name">Your name</label
                ><input
                  id="f-name"
                  required
                  value=${v.name}
                  onInput=${set("name")}
                  autocomplete="name"
                />
              </div>
              <div class="field">
                <label htmlFor="f-phone">Phone</label
                ><input
                  id="f-phone"
                  type="tel"
                  required
                  value=${v.phone}
                  onInput=${set("phone")}
                  autocomplete="tel"
                />
              </div>
              <div class="field">
                <label htmlFor="f-type">Business type</label>
                <select id="f-type" value=${v.type} onChange=${set("type")}>
                  <option>PG or hostel</option>
                  <option>Apartments</option>
                  <option>Co-living</option>
                  <option>Mixed portfolio</option>
                </select>
              </div>
              <div class="field">
                <label htmlFor="f-size">Rooms or units</label
                ><input
                  id="f-size"
                  inputmode="numeric"
                  value=${v.size}
                  onInput=${set("size")}
                />
              </div>
              <div class="field full">
                <label htmlFor="f-city">City</label
                ><input id="f-city" value=${v.city} onInput=${set("city")} />
              </div>
              <div class="field full">
                <label htmlFor="f-note">Anything we should know</label
                ><textarea
                  id="f-note"
                  value=${v.note}
                  onInput=${set("note")}
                ></textarea>
              </div>
              <div class="field full">
                <button class="btn primary" type="submit">
                  Prepare my request
                </button>
              </div>
              ${msg
                ? html`<div class="out">
                    <p>
                      This page does not send anything. Copy the message and
                      send it to us.
                    </p>
                    <textarea
                      ref=${ta}
                      readonly
                      value=${msg}
                      aria-label="Your request"
                    ></textarea>
                    <div class="cta-row">
                      <button class="btn ghost" type="button" onClick=${copy}>
                        Copy message
                      </button>
                      ${mail
                        ? html`<a class="btn ghost" href=${mail}>Open email</a>`
                        : null}
                      ${wa
                        ? html`<a
                            class="btn primary"
                            href=${wa}
                            target="_blank"
                            rel="noopener"
                            >Open WhatsApp</a
                          >`
                        : null}
                    </div>
                    ${copied
                      ? html`<p role="status" style=${{ marginTop: "10px" }}>
                          ${copied}
                        </p>`
                      : null}
                  </div>`
                : null}
            </form>
          </div>
        </section>`;
      }

      function Footer() {
        return html`<footer>
          <div class="wrap">
            <div>
              <${Brand} />
              <p style=${{ marginTop: "12px" }}>
                Property management software for PG, hostel, co-living and
                apartment operators, with setup, hosting and support.
              </p>
            </div>
            <p>
              Tenant documents are stored privately and access is limited by
              role and property.
            </p>
          </div>
        </footer>`;
      }

      function Site() {
        return html`<div>
          <${Nav} /><${Hero} /><${Problem} /><${Features} /><${Audience} /><${How} />
          <${App} /><${Pricing} /><${Services} /><${Faq} /><${Demo} /><${Footer} />
        </div>`;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        html`<${Site} />`,
      );
    </script>
  </body>
</html>
